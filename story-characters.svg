<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 210" fill="none">
  <style>
    .outline{stroke:none}
    .green{transform-box:fill-box;transform-origin:center bottom;animation:walk .8s ease-in-out infinite}
    .green-leg-left{transform-box:fill-box;transform-origin:top center;animation:step .34s ease-in-out infinite alternate}
    .green-leg-right{transform-box:fill-box;transform-origin:top center;animation:step .34s ease-in-out .17s infinite alternate-reverse}
    .pink{transform-box:fill-box;transform-origin:center bottom;animation:bounce 1.55s ease-in-out .3s infinite}
    .owl{transform-box:fill-box;transform-origin:center bottom;animation:read 2.5s ease-in-out infinite}
    .page{transform-box:fill-box;transform-origin:left center;animation:page-turn 2.2s ease-in-out infinite}
    @keyframes walk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(3deg)}}
    @keyframes step{from{transform:rotate(-34deg)}to{transform:rotate(34deg)}}
    @keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.025)}}
    @keyframes read{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(2deg)}}
    @keyframes page-turn{0%,66%,100%{transform:rotateY(0)}82%{transform:rotateY(-55deg)}}
    @media(prefers-reduced-motion:reduce){.green,.green-leg-left,.green-leg-right,.pink,.owl,.page{animation:none}}
  </style>
